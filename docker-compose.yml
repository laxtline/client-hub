version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clienthub-postgres
    environment:
      POSTGRES_USER: clienthub
      POSTGRES_PASSWORD: clienthub
      POSTGRES_DB: clienthub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clienthub -d clienthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clienthub-server
    environment:
      DATABASE_URL: postgresql://clienthub:clienthub@postgres:5432/clienthub?schema=public
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      AI_SERVICE_URL: http://ai-service:8000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Asia/Kolkata}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clienthub-client
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

  ai-service:
    build:
      context: ./python-services/ai-service
      dockerfile: Dockerfile
    container_name: clienthub-ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    volumes:
      - ./python-services/ai-service:/app
      - /app/__pycache__

volumes:
  postgres_data: