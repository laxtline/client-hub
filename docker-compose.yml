# One-command local stack: Postgres + backend API + frontend (nginx).
#
#   docker compose up --build
#
# Then open http://localhost:5173 (frontend) — it talks to the API on :5000.
# Copy server/.env.example values you care about (JWT_SECRET, GROQ_API_KEY,
# Razorpay/ImageKit/SMTP) into a .env file next to this compose file, or rely
# on the safe defaults below for a quick demo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clienthub
      POSTGRES_PASSWORD: clienthub
      POSTGRES_DB: clienthub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clienthub']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://clienthub:clienthub@db:5432/clienthub?schema=public
      # Demo-only default, intentionally 32+ chars so the server's weak-secret
      # check passes; set a real JWT_SECRET in .env for anything public.
      JWT_SECRET: ${JWT_SECRET:-clienthub_local_demo_secret_do_not_use_in_prod_0000}
      JWT_EXPIRES_IN: 7d
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ClientHub <no-reply@clienthub.app>}
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-rzp_test_xxxxxxxx}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  pgdata:
