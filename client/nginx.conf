# nginx config for the SPA: serve static files and fall back to index.html
# so client-side routes (e.g. /admin, /projects/:id) work on refresh.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text assets. The JS bundles drop to roughly a third of their size
  # on the wire, which is the cheapest first-load win available here.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # Baseline security headers (the API sets its own via Helmet).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached, or a returning user keeps booting an old
  # bundle that references asset hashes the server no longer has.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Cache hashed assets aggressively (filenames change on each build).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
