<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClientHub — an AI-powered portal for agencies to manage clients, projects, Kanban tasks, invoices and online payments, with weekly AI progress reports."
    />
    <meta name="author" content="Suryakanta Pradhan" />
    <meta name="theme-color" content="#1F355E" />

    <!-- Link previews (LinkedIn / WhatsApp / Twitter) when sharing the demo. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClientHub — AI-Powered Agency Portal" />
    <meta
      property="og:description"
      content="Clients, projects, Kanban tasks, invoicing and payments in one role-based portal — with AI weekly progress reports."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Simple inline SVG favicon (a blue "C" mark) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231F355E'/><text x='16' y='22' font-size='18' fill='white' text-anchor='middle' font-family='Arial'>C</text></svg>" />
    <title>ClientHub — Agency Portal</title>

    <!--
      Apply the saved theme BEFORE React mounts. Without this the page paints
      the light background first and then snapped to dark once ThemeContext
      ran — a visible white flash on every load for dark-mode users.
      Kept inline and tiny on purpose: it must run before first paint.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode / storage disabled — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ClientHub needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
